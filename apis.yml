name: Pelage Pharmaceuticals
description: 'Pelage Pharmaceuticals is a clinical-stage biotechnology company developing
  regenerative medicines for hair loss based on hair follicle stem cell biology discovered
  by UCLA researchers. Its lead candidate, PP405, is a topically-applied small molecule
  that reactivates dormant hair follicle stem cells via a metabolic switch to stimulate
  regrowth, targeting androgenetic alopecia, drug-induced alopecia, and telogen effluvium;
  it is non-hormonal, non-invasive, and in Phase 2 clinical trials. The company was
  surfaced as a portfolio company of GV (Google Ventures). It publishes a corporate
  site and a clinical-trials site but no public developer, API, or technical surface.'
